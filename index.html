<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ritual-green: #00F58C;
            --dark-green: #00241B;
            --deep-black: #000a09;
            --card-bg: rgba(0, 36, 27, 0.7);
        }

        body {
            background: var(--deep-black);
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--ritual-green);
            text-shadow: 0 0 15px rgba(0, 245, 140, 0.3);
            text-transform: uppercase;
        }

        .cyber-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 245, 140, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            height: 100%;
        }

        .cyber-card:hover {
            border-color: var(--ritual-green);
            box-shadow: 0 0 25px rgba(0, 245, 140, 0.15);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: var(--ritual-green) !important;
            box-shadow: 0 0 10px rgba(0, 245, 140, 0.2);
        }

        .btn-cyber {
            background: var(--ritual-green);
            color: var(--deep-black);
            font-weight: 700;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            width: 100%;
            padding: 12px;
        }

        .btn-cyber:hover {
            box-shadow: 0 0 20px var(--ritual-green);
            background: #fff;
            transform: translateY(-2px);
        }

        .result-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed rgba(0, 245, 140, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            min-height: 60px;
        }

        .train-hero {
            background: linear-gradient(rgba(0,36,27,0.85), rgba(0,36,27,0.85)), 
                        url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=1000');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ritual-green);
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none !important;
            transition: 0.4s ease;
            margin-bottom: 24px;
        }

        .train-hero:hover { border-color: #fff; transform: scale(1.02); }
        .train-hero h2 { font-family: 'Orbitron'; color: var(--ritual-green); font-size: 2.2rem; }

        #logsOutput {
            background: #000;
            border: 1px solid #111;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            height: 180px;
            overflow-y: auto;
            color: #666;
            padding: 10px;
        }

        .log-time { color: var(--ritual-green); opacity: 0.7; }
    </style>
</head>

    <div class="row g-4">
        <!-- AI SERVICES -->
        <div class="col-lg-6">
            <div class="cyber-card p-4 mb-4">
                <h5 class="text-white mb-3"><i class="fa-solid fa- magnifying-glass-chart text-success"></i> AI Detection Oracle</h5>
                <textarea id="checkTextInput" class="form-control mb-3" rows="3" placeholder="Paste text for AI validation..."></textarea>
                <button id="checkBtn" class="btn btn-cyber" onclick="handleProcess('check')">Start Verification</button>
                <div id="checkResultLabel" class="mt-3 text-info small font-monospace"></div>
            </div>

            <div class="cyber-card p-4">
                <h5 class="text-white mb-3"><i class="fa-solid fa-wand-magic-sparkles text-success"></i> Text Humanizer</h5>
                <textarea id="humanizeTextInput" class="form-control mb-3" rows="3" placeholder="Paste text to humanize..."></textarea>
                <button id="humanizeBtn" class="btn btn-cyber" onclick="handleProcess('humanize')">Humanize Protocol</button>
                
                <div id="humanResultPanel" class="result-panel d-none mt-3">
                    <div id="humanResultText" class="small text-secondary"></div>
                </div>
            </div>
        </div>

        <!-- CENTER LOGS & HERO -->
        <div class="col-lg-6">
            <a href="academy.html" class="train-hero cyber-card">
                <h2>TRAIN YOUR AGENT</h2>
                <p class="text-white opacity-75">Expand local vector knowledge bases</p>
            </a>

            <div class="cyber-card p-4">
                <h6 class="text-success mb-3"><i class="fa-solid fa-code"></i> System Logs</h6>
                <div id="logsOutput">
                    > Ritual Node: Active<br>
                    > Encryption: Enabled<br>
                    > Access: Free Public
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://recipient-riverside-duckling.ngrok-free.dev/api/process-text';

    function addLog(msg) {
        const logs = document.getElementById('logsOutput');
        const time = new Date().toLocaleTimeString();
        logs.innerHTML += `<br><span class="log-time">[${time}]</span> > ${msg}`;
        logs.scrollTop = logs.scrollHeight;
    }

    async function handleProcess(action) {
        const inputId = action === 'check' ? 'checkTextInput' : 'humanizeTextInput';
        const text = document.getElementById(inputId).value.trim();
        const btn = action === 'check' ? document.getElementById('checkBtn') : document.getElementById('humanizeBtn');

        if (!text) {
            alert("Please input text first!");
            return;
        }

        const originalText = btn.innerText;
        btn.innerText = "PROCESSING...";
        btn.disabled = true;
        addLog(`Requesting ${action.toUpperCase()}...`);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true' 
                },
                body: JSON.stringify({ text, action })
            });

            if (!response.ok) throw new Error("Server communication error");

            const data = await response.json();

            if (action === 'humanize') {
                document.getElementById('humanResultPanel').classList.remove('d-none');
                document.getElementById('humanResultText').innerText = data.result || "No data received";
            } else {
                document.getElementById('checkResultLabel').innerText = "NODE REPORT: " + (data.result || "Complete");
            }
            addLog("Transaction verified. Result delivered.");

        } catch (e) {
            addLog(`Error: ${e.message}`);
            console.error(e);
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
</script>
