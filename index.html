<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RITUAL | AI AGENT HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ritual-green: #00F58C;
            --dark-green: #00241B;
            --deep-black: #000a09;
            --card-bg: rgba(0, 36, 27, 0.7);
        }

        body {
            background: var(--deep-black);
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--ritual-green);
            text-shadow: 0 0 15px rgba(0, 245, 140, 0.3);
        }

        .cyber-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 245, 140, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .cyber-card:hover {
            border-color: var(--ritual-green);
            box-shadow: 0 0 25px rgba(0, 245, 140, 0.15);
        }

        /* Input Container with Clear Button */
        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 8px;
            padding-right: 40px;
        }

        .form-control:focus {
            border-color: var(--ritual-green) !important;
            box-shadow: 0 0 10px rgba(0, 245, 140, 0.2);
        }

        .clear-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--ritual-green);
            opacity: 0.5;
            transition: 0.3s;
            z-index: 5;
        }

        .clear-btn:hover { opacity: 1; transform: scale(1.1); }

        .btn-cyber {
            background: var(--ritual-green);
            color: var(--deep-black);
            font-weight: 700;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-cyber:hover {
            box-shadow: 0 0 20px var(--ritual-green);
            background: #fff;
        }

        /* Compact Result Box */
        .result-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed rgba(0, 245, 140, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            position: relative;
        }

        .scroll-area {
            max-height: 140px;
            overflow-y: auto;
            font-size: 0.95rem;
            color: #d1d5db;
            padding-right: 10px;
            line-height: 1.4;
        }

        .scroll-area::-webkit-scrollbar { width: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: var(--ritual-green); border-radius: 10px; }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.75rem;
            padding: 2px 8px;
            color: var(--ritual-green);
            border-color: var(--ritual-green);
        }

        /* Hero Train Button */
        .train-hero {
            background: linear-gradient(rgba(0,36,27,0.8), rgba(0,36,27,0.8)), 
                        url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=1000');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ritual-green);
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none !important;
            transition: 0.4s ease;
        }

        .train-hero:hover { transform: translateY(-5px); border-color: #fff; }
        .train-hero h2 { font-family: 'Orbitron'; color: var(--ritual-green); font-size: 2.5rem; margin: 0; }

        /* Logs Console */
        #logsOutput {
            background: #000;
            border: 1px solid #111;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            min-height: 150px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-5 border-bottom border-success pb-4">
        <div>
            <h1 class="brand-title mb-1"><i class="fa-solid fa-microchip"></i> RITUAL AGENT HUB</h1>
            <p class="text-secondary mb-0">Autonomous Oracle Services & AI Text Processing</p>
        </div>
        <button id="connectWalletBtn" class="btn btn-outline-success btn-lg" onclick="connectWallet()">
            <i class="fa-solid fa-wallet me-2"></i> Connect Wallet
        </button>
    </div>

    <div class="row g-4">
        <!-- AI CORE -->
        <div class="col-lg-5">
            <h3 class="text-success mb-3"><i class="fa-solid fa-terminal"></i> Core Services</h3>
            
            <!-- Detector -->
            <div class="cyber-card p-4 mb-4">
                <h5 class="text-white mb-3">AI Detection Oracle</h5>
                <div class="input-wrapper">
                    <textarea id="checkTextInput" class="form-control mb-3" rows="3" placeholder="Paste text to verify..."></textarea>
                    <button class="clear-btn" onclick="clearField('checkTextInput')"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
                <button class="btn btn-cyber w-100" onclick="handleProcess('check')">Execute Scan</button>
                <div id="checkResultLabel" class="mt-2 text-info small"></div>
            </div>

            <!-- Humanizer -->
            <div class="cyber-card p-4">
                <h5 class="text-white mb-3">Text Humanizer</h5>
                <div class="input-wrapper">
                    <textarea id="humanizeTextInput" class="form-control mb-3" rows="3" placeholder="Paste text to rewrite..."></textarea>
                    <button class="clear-btn" onclick="clearField('humanizeTextInput')"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
                <button class="btn btn-cyber w-100" onclick="handleProcess('humanize')">Humanize Protocol</button>
                
                <div id="humanResultPanel" class="result-panel d-none">
                    <button class="btn btn-outline-success btn-sm copy-btn" onclick="copyToClipboard()">
                        <i class="fa-solid fa-copy"></i> Copy
                    </button>
                    <div id="humanResultText" class="scroll-area"></div>
                </div>
            </div>
        </div>

        <!-- ACTIONS & LOGS -->
        <div class="col-lg-7">
            <h3 class="text-success mb-3"><i class="fa-solid fa-graduation-cap"></i> Academy</h3>
            
            <a href="academy.html" class="train-hero cyber-card mb-4">
                <h2>TRAIN YOUR AGENT</h2>
                <p class="text-white opacity-75">Expand skills and vector memory</p>
            </a>

            <div class="cyber-card p-4">
                <h5 class="text-success mb-3"><i class="fa-solid fa-code"></i> Live Execution Logs</h5>
                <div id="logsOutput" class="p-3 rounded text-secondary">
                    > System: Online<br>
                    > Node: Connected to Ritual Devnet
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ЗАМЕНИ ССЫЛКУ НИЖЕ НА СВОЮ ИЗ NGROK
    const API_URL = 'https://recipient-riverside-duckling.ngrok-free.dev/api/process-text';

    function clearField(id) {
        document.getElementById(id).value = '';
        if(id === 'humanizeTextInput') document.getElementById('humanResultPanel').classList.add('d-none');
        addLog(`> Field ${id} cleared`);
    }

    function addLog(msg) {
        const logs = document.getElementById('logsOutput');
        logs.innerHTML += `<br>${msg}`;
        logs.scrollTop = logs.scrollHeight;
    }

    async function copyToClipboard() {
        const text = document.getElementById('humanResultText').innerText;
        await navigator.clipboard.writeText(text);
        const btn = document.querySelector('.copy-btn');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Done';
        setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy', 2000);
    }

    async function handleProcess(action) {
        const inputId = action === 'check' ? 'checkTextInput' : 'humanizeTextInput';
        const text = document.getElementById(inputId).value;
        if (!text) return;

        addLog(`> Initiating ${action.toUpperCase()} protocol...`);
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                body: JSON.stringify({ text, action })
            });
            const data = await response.json();

            if (action === 'humanize') {
                document.getElementById('humanResultPanel').classList.remove('d-none');
                document.getElementById('humanResultText').innerText = data.result;
            } else {
                document.getElementById('checkResultLabel').innerText = `Verdict: ${data.result}`;
            }

            addLog(`> Status: Success. Fee: ${data.fee}`);
        } catch (e) {
            addLog(`> Error: Node unreachable. Check ngrok/server.`);
        }
    }

    async function connectWallet() {
        if (window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            document.getElementById('connectWalletBtn').innerText = accounts[0].slice(0,6) + '...' + accounts[0].slice(-4);
            addLog(`> Wallet Connected: ${accounts[0]}`);
        }
    }
</script>
</body>
</html>
