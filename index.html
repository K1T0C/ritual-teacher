        <!-- Левая колонка -->
        <div class="col-md-6">
            <div class="cyber-card mb-4">
                <h5>AI Detector</h5>
                <textarea id="checkTextInput" class="form-control" rows="3" placeholder="Paste text..."></textarea>
                <button id="checkBtn" class="btn btn-cyber" onclick="process('check')">VERIFY TEXT</button>
                <div id="checkResultLabel" class="mt-2 small text-info"></div>
            </div>

            <div class="cyber-card">
                <h5>Humanizer</h5>
                <textarea id="humanizeTextInput" class="form-control" rows="3" placeholder="Paste text..."></textarea>
                <button id="humanizeBtn" class="btn btn-cyber" onclick="process('humanize')">HUMANIZE</button>
                <div id="humanResultPanel" class="result-panel d-none">
                    <div id="humanResultText" class="small"></div>
                </div>
            </div>
        </div>

            <a href="academy.html" class="train-hero cyber-card mb-4">
                <h3>TRAIN YOUR AGENT</h3>

                <h6>System Logs</h6>

            </div>
        </div>
    </div>

<script>
    const API_URL = 'https://recipient-riverside-duckling.ngrok-free.dev/api/process-text';

    function addLog(m) {
        const l = document.getElementById('logsOutput');
        l.innerHTML += `> ${m}<br>`;
        l.scrollTop = l.scrollHeight;
    }

    addLog("System initialized. Free access enabled.");

    async function process(action) {
        const inputId = action === 'check' ? 'checkTextInput' : 'humanizeTextInput';
        const text = document.getElementById(inputId).value.trim();
        const btn = action === 'check' ? document.getElementById('checkBtn') : document.getElementById('humanizeBtn');

        if (!text) {
            alert("Enter text!");
            return;
        }

        const originalText = btn.innerText;
        btn.innerText = "PROCESSING...";
        btn.disabled = true;
        addLog(`Sending ${action} request...`);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                body: JSON.stringify({ text, action })
            });

            const data = await response.json();
            
            if (action === 'humanize') {
                document.getElementById('humanResultPanel').classList.remove('d-none');
                document.getElementById('humanResultText').innerText = data.result || "Error";
            } else {
                document.getElementById('checkResultLabel').innerText = "Report: " + (data.result || "Done");
            }
            addLog("Success!");
        } catch (e) {
            addLog("Error: " + e.message);
            console.error(e);
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
</script>
