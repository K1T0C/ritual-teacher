<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RITUAL | TEACHER HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ritual-green: #00F58C;
            --dark-green: #00241B;
            --deep-black: #000a09;
            --card-bg: rgba(0, 36, 27, 0.7);
        }

        body {
            background: var(--deep-black);
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--ritual-green);
            text-shadow: 0 0 15px rgba(0, 245, 140, 0.3);
            text-transform: uppercase;
        }

        .cyber-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 245, 140, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .cyber-card:hover {
            border-color: var(--ritual-green);
            box-shadow: 0 0 25px rgba(0, 245, 140, 0.15);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: var(--ritual-green) !important;
            box-shadow: 0 0 10px rgba(0, 245, 140, 0.2);
        }

        .btn-cyber {
            background: var(--ritual-green);
            color: var(--deep-black);
            font-weight: 700;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-cyber:hover {
            box-shadow: 0 0 20px var(--ritual-green);
            background: #fff;
        }

        .result-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed rgba(0, 245, 140, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            position: relative;
        }

        .scroll-area {
            max-height: 140px;
            overflow-y: auto;
            font-size: 0.95rem;
            color: #d1d5db;
        }

        #logsOutput {
            background: #000;
            border: 1px solid #111;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            min-height: 150px;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5 border-bottom border-success pb-4">
        <div class="d-flex align-items-center">
            <img src="https://ritual.net/favicon.ico" style="height: 40px; margin-right: 15px;">
            <div>
                <h1 class="brand-title mb-1">RITUAL TEACHER</h1>
                <p class="text-secondary mb-0">Autonomous Agent Training & Text Processing</p>
            </div>
        </div>
        <button id="connectWalletBtn" class="btn btn-outline-success btn-lg" onclick="connectWallet()">
            <i class="fa-solid fa-wallet me-2"></i> Connect Wallet
        </button>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <h3 class="text-success mb-3">Mentor Services</h3>
            <div class="cyber-card p-4 mb-4">
                <h5 class="text-white mb-3">AI Detection Oracle</h5>
                <textarea id="checkTextInput" class="form-control mb-3" rows="3" placeholder="Paste text for validation..."></textarea>
                <button class="btn btn-cyber w-100" onclick="handleProcess('check')">Start Verification</button>
                <div id="checkResultLabel" class="mt-2 text-info small"></div>
            </div>

            <div class="cyber-card p-4">
                <h5 class="text-white mb-3">Text Humanizer</h5>
                <textarea id="humanizeTextInput" class="form-control mb-3" rows="3" placeholder="Paste text to humanize..."></textarea>
                <button class="btn btn-cyber w-100" onclick="handleProcess('humanize')">Humanize Protocol</button>
                <div id="humanResultPanel" class="result-panel d-none">
                    <div id="humanResultText" class="scroll-area"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <h3 class="text-success mb-3">Training Center</h3>
            <div class="cyber-card p-4 mb-4 text-center">
                <h2 class="text-success">TRAIN YOUR AGENT</h2>
                <p class="opacity-75">Expand skills and optimize datasets</p>
            </div>

            <div class="cyber-card p-4">
                <h5 class="text-success mb-3">System Logs</h5>
                <div id="logsOutput">
                    > Ritual Teacher System: Online<br>
                    > Node: Connected
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://recipient-riverside-duckling.ngrok-free.dev/api/process-text';
    const MY_WALLET = '0x5CE75a2486c64dA615fA116B8C53672F0c4A179b';

    // Функция поиска правильного провайдера кошелька
    function getProvider() {
        if (!window.ethereum) return null;
        if (window.ethereum.providers) {
            return window.ethereum.providers.find((p) => p.isMetaMask) || window.ethereum.providers[0];
        }
        return window.ethereum;
    }

    function addLog(msg) {
        const logs = document.getElementById('logsOutput');
        logs.innerHTML += `<br>> ${msg}`;
        logs.scrollTop = logs.scrollHeight;
    }

    async function connectWallet() {
        const provider = getProvider();
        if (!provider) return alert("Please install MetaMask!");
        
        try {
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            document.getElementById('connectWalletBtn').innerText = accounts[0].slice(0,6) + '...' + accounts[0].slice(-4);
            addLog(`Wallet Connected: ${accounts[0]}`);
        } catch (e) {
            addLog(`Connection failed: ${e.message}`);
        }
    }

    async function handleProcess(action) {
        const inputId = action === 'check' ? 'checkTextInput' : 'humanizeTextInput';
        const text = document.querySelector('#' + inputId).value.trim();
        const provider = getProvider();

        if (!text) return alert("Please enter text!");
        if (!provider) return alert("Wallet not found!");

        addLog(`Initiating ${action.toUpperCase()}... Waiting for payment.`);

        try {
            // 1. Запрос аккаунтов
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            const userAddress = accounts[0];

            // 2. Оплата (0.001 RTL)
            const txHash = await provider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: userAddress,
                    to: MY_WALLET,
                    value: '0x38d7ea4c68000', // 0.001 в Hex
                }],
            });

            // ... после вызова транзакции
if (!txHash || txHash === "" || txHash.length < 10) {
    addLog("Критическая ошибка: Транзакция не подтверждена кошельком.");
    alert("Оплата не прошла. Запрос отменен.");
    return; // Останавливаем выполнение, чтобы не слать пустой запрос
}

addLog(`Оплата получена: ${txHash.slice(0,10)}... Отправка на сервер.`);

// Только теперь идет fetch
const response = await fetch(API_URL, { ... });

            // 3. Отправка на бэкенд
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true' 
                },
                body: JSON.stringify({ text, action, txHash })
            });

            const data = await response.json();

            // 4. Результаты
            if (action === 'humanize') {
                document.getElementById('humanResultPanel').classList.remove('d-none');
                document.getElementById('humanResultText').innerText = data.result;
            } else {
                document.getElementById('checkResultLabel').innerText = `Report: ${data.result}`;
            }

            addLog(`Execution Success. Fee: ${data.fee || '0.001 RTL'}`);

        } catch (error) {
            console.error(error);
            addLog(`Error: ${error.message}`);
            if (action === 'check') document.getElementById('checkResultLabel').innerText = "Process halted.";
        }
    }
</script>
</body>
</html>
