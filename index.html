<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RITUAL | TEACHER HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ritual-green: #00F58C;
            --dark-green: #00241B;
            --deep-black: #000a09;
            --card-bg: rgba(0, 36, 27, 0.7);
        }

        body {
            background: var(--deep-black);
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--ritual-green);
            text-shadow: 0 0 15px rgba(0, 245, 140, 0.3);
            text-transform: uppercase;
        }

        .cyber-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 245, 140, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .cyber-card:hover {
            border-color: var(--ritual-green);
            box-shadow: 0 0 25px rgba(0, 245, 140, 0.15);
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 8px;
            padding-right: 40px;
        }

        .form-control:focus {
            border-color: var(--ritual-green) !important;
            box-shadow: 0 0 10px rgba(0, 245, 140, 0.2);
        }

        .clear-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--ritual-green);
            opacity: 0.5;
            transition: 0.3s;
            z-index: 5;
        }

        .clear-btn:hover { opacity: 1; transform: scale(1.1); }

        .btn-cyber {
            background: var(--ritual-green);
            color: var(--deep-black);
            font-weight: 700;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-cyber:hover {
            box-shadow: 0 0 20px var(--ritual-green);
            background: #fff;
        }

        .result-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed rgba(0, 245, 140, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            position: relative;
        }

        .scroll-area {
            max-height: 140px;
            overflow-y: auto;
            font-size: 0.95rem;
            color: #d1d5db;
            padding-right: 10px;
            line-height: 1.4;
        }

        .scroll-area::-webkit-scrollbar { width: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: var(--ritual-green); border-radius: 10px; }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.75rem;
            padding: 2px 8px;
            color: var(--ritual-green);
            border-color: var(--ritual-green);
        }

        .train-hero {
            background: linear-gradient(rgba(0,36,27,0.8), rgba(0,36,27,0.8)), 
                        url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=1000');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ritual-green);
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none !important;
            transition: 0.4s ease;
        }

        .train-hero:hover { transform: translateY(-5px); border-color: #fff; }
        .train-hero h2 { font-family: 'Orbitron'; color: var(--ritual-green); font-size: 2.5rem; margin: 0; }

        #logsOutput {
            background: #000;
            border: 1px solid #111;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            min-height: 150px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>

<script>
    const API_URL = 'https://recipient-riverside-duckling.ngrok-free.dev/api/process-text';
    const MY_WALLET = '0x5CE75a2486c64dA615fA116B8C53672F0c4A179b';

    function addLog(msg) {
        const logs = document.getElementById('logsOutput');
        logs.innerHTML += `<br>> ${msg}`;
        logs.scrollTop = logs.scrollHeight;
    }

    function clearField(id) {
        document.getElementById(id).value = '';
        if(id === 'humanizeTextInput') document.getElementById('humanResultPanel').classList.add('d-none');
        addLog(`Field ${id} cleared`);
    }

    async function copyToClipboard() {
        const text = document.getElementById('humanResultText').innerText;
        await navigator.clipboard.writeText(text);
        const btn = document.querySelector('.copy-btn');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
        setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy', 2000);
    }

    function getProvider() {
        if (!window.ethereum) return null;
        if (window.ethereum.providers) {
            return window.ethereum.providers.find(p => p.isMetaMask) || window.ethereum.providers[0];
        }
        return window.ethereum;
    }

    async function connectWallet() {
        const provider = getProvider();
        if (provider) {
            try {
                const accounts = await provider.request({ method: 'eth_requestAccounts' });
                document.getElementById('connectWalletBtn').innerText = accounts[0].slice(0,6) + '...' + accounts[0].slice(-4);
                addLog(`Wallet Connected: ${accounts[0]}`);
            } catch (e) { addLog("Connection failed."); }
        } else { alert("Install MetaMask or Rabby!"); }
    }

    async function handleProcess(action) {
        const inputId = action === 'check' ? 'checkTextInput' : 'humanizeTextInput';
        const textInput = document.getElementById(inputId);
        const text = textInput ? textInput.value : '';
        const provider = getProvider();

        if (!text) return alert("Enter text!");
        if (!provider) return alert("Wallet not found!");

        addLog(`Initiating ${action.toUpperCase()}... Waiting for payment.`);

        try {
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            const txHash = await provider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: accounts[0],
                    to: MY_WALLET,
                    value: '0x38d7ea4c68000', // 0.001 RTL
                }],
            });

            if (!txHash) return;

            addLog(`Paid! TX: ${txHash.slice(0,10)}... Sending to AI Node.`);

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true' 
                },
                body: JSON.stringify({ text, action, txHash })
            });

            const data = await response.json();

            if (action === 'humanize') {
                document.getElementById('humanResultPanel').classList.remove('d-none');
                document.getElementById('humanResultText').innerText = data.result;
            } else {
                document.getElementById('checkResultLabel').innerText = `Report: ${data.result}`;
            }
            addLog("Success.");

        } catch (err) {
            addLog(`Error: ${err.message || "Transaction failed"}`);
            console.error(err);
        }
    }
</script>
